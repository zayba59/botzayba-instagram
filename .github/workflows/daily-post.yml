name: Günlük Instagram paylaşımı

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Teşhis
        run: |
          mkdir -p posts
          echo "== ls" > posts/diag.txt
          ls -l assets/ >> posts/diag.txt 2>&1
          echo "== file" >> posts/diag.txt
          file assets/logo_white.png >> posts/diag.txt 2>&1 || true
          echo "== head" >> posts/diag.txt
          head -c 32 assets/logo_white.png | od -c >> posts/diag.txt 2>&1
          echo "== md5" >> posts/diag.txt
          md5sum assets/*.png >> posts/diag.txt 2>&1
          echo "== git" >> posts/diag.txt
          git ls-files -s assets/ >> posts/diag.txt 2>&1
          echo "== pillow" >> posts/diag.txt
          python -c "import PIL; from PIL import features; print(PIL.__version__, features.check('zlib'))" >> posts/diag.txt 2>&1
          echo "== open" >> posts/diag.txt
          python -c "from PIL import Image; im=Image.open('assets/logo_white.png'); im.load(); print('OK', im.size, im.mode)" >> posts/diag.txt 2>&1 || true
          cat posts/diag.txt
          git config user.name "botzayba-bot"
          git config user.email "botzayba-bot@users.noreply.github.com"
          git add -f posts/diag.txt
          git commit -m "Teshis" || true
          git push || true

      - name: Günün reklamını hazırla
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/daily.py prepare

      - name: Görseli depoya kaydet
        id: commit
        run: |
          git config user.name "botzayba-bot"
          git config user.email "botzayba-bot@users.noreply.github.com"
          git add posts/
          git diff --cached --quiet || git commit -m "Günlük paylaşım: $(date +%F)"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Instagram'a paylaş
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.commit.outputs.sha }}
        run: python scripts/daily.py publish

      - name: Erişim anahtarını yenile
        if: always()
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/daily.py refresh

      - name: Paylaşım kaydını güncelle
        run: |
          git add posts/state.json
          git diff --cached --quiet || (git commit -m "Paylaşım kaydı: $(date +%F)" && git push)
