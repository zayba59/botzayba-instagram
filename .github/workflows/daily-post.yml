name: Günlük Instagram paylaşımı

on:
  schedule:
    # Hedef: Türkiye saati 09:00 sonrası ilk müsait çalıştırma.
    #
    # GitHub zamanlanmış işleri garanti etmiyor; ücretsiz hesaplarda saatlerce
    # gecikebiliyor (bu depoda ölçülen gecikme 4-6 saat). Tek bir cron bu yüzden
    # hedefi tutturamaz. Onun yerine gün içine birkaç deneme serpiştiriyoruz;
    # aşağıdaki "kapi" işi, Türkiye saati 09:00'u geçmeden hiçbirinin paylaşım
    # yapmasına izin vermiyor ve günde yalnızca bir kez geçiş veriyor.
    # 06:04-08:49 UTC (09:04-11:49 TR) sık denemeler, gün içinde iki ek deneme.
    - cron: "4,19,34,49 6-8 * * *"
    - cron: "23 9,11 * * *"
  workflow_dispatch: {}   # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  # Sırası gelmiş mi? Gelmediyse asıl iş hiç başlamaz (saniyeler sürer).
  kapi:
    runs-on: ubuntu-latest
    outputs:
      calistir: ${{ steps.karar.outputs.calistir }}
    steps:
      - uses: actions/checkout@v4
      - id: karar
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "::notice::Elle başlatıldı — saat koşulu aranmıyor."
            echo "calistir=evet" >> "$GITHUB_OUTPUT"; exit 0
          fi
          bugun=$(TZ=Europe/Istanbul date +%F)
          saat=$(TZ=Europe/Istanbul date +%H%M)
          son=$(cat .gunluk-son 2>/dev/null || echo "-")
          if [ "$son" = "$bugun" ]; then
            echo "::notice::Bugün ($bugun) zaten paylaşıldı — atlanıyor."
            echo "calistir=hayir" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$((10#$saat))" -lt 900 ]; then
            echo "::notice::Türkiye saati $saat — 09:00'dan erken, sonraki denemeye bırakılıyor."
            echo "calistir=hayir" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::notice::Türkiye saati $saat — paylaşım sırası geldi."
          echo "calistir=evet" >> "$GITHUB_OUTPUT"

  post:
    needs: kapi
    if: needs.kapi.outputs.calistir == 'evet'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Günün reklamını hazırla
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/daily.py prepare

      - name: Görseli depoya kaydet
        id: commit
        run: |
          git config user.name "botzayba-bot"
          git config user.email "botzayba-bot@users.noreply.github.com"
          git add posts/
          git diff --cached --quiet || git commit -m "Günlük paylaşım: $(date +%F)"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Günlük Instagram yayın girişimini kaydet
        run: |
          python scripts/daily.py reserve
          git add posts/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Günlük Instagram yayın rezervasyonu"
            git push origin HEAD:main
          fi

      - name: Instagram'a paylaş
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.commit.outputs.sha }}
        run: python scripts/daily.py publish

      - name: Paylaşım kimliğini hemen kaydet
        run: |
          git add posts/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Instagram yayın kimliğini kaydet: $(TZ=Europe/Istanbul date +%F)"
            git push origin HEAD:main
          fi

      - name: E-posta gönder
        if: always()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/daily.py notify

      - name: Erişim anahtarını yenile
        if: always()
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/daily.py refresh

      - name: Paylaşım kaydını güncelle
        run: |
          # .gunluk-son: kapı işinin "bugün yapıldı mı" diye baktığı işaret dosyası.
          # Elle başlatılan gönderiler planlı günlük gönderiyi engellemez.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TZ=Europe/Istanbul date +%F > .gunluk-son
            git add .gunluk-son
          fi
          git add posts/state.json
          git diff --cached --quiet || (git commit -m "Paylaşım kaydı: $(date +%F)" && git push)
