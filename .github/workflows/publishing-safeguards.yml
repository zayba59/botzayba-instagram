name: Publishing safeguards (offline tests)

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/upload_registry.py'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline safeguards
        run: python -m unittest discover -s tests -v
